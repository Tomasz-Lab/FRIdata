name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: |
          # Create a hash from the environment file and PyTorch CPU install string
          ENV_HASH=$(sha256sum toolbox_env_conda.yml | cut -d' ' -f1)
          PYTORCH_SPEC="pytorch-cpuonly"
          CACHE_KEY="micromamba-${{ runner.os }}-${ENV_HASH}-${PYTORCH_SPEC}"
          echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

      - name: Restore micromamba environment cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/micromamba/envs
            ~/micromamba-bin
          key: ${{ steps.cache-key.outputs.key }}

      - name: Debug micromamba cache state
        env:
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
        run: |
          # #region agent log
          python - <<'PY'
          import json
          import os
          import stat
          import time
          from pathlib import Path
          import shutil

          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          log_path = Path(workspace) / ".cursor" / "debug.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)

          def write_log(message, data, hypothesis_id):
              payload = {
                  "sessionId": "debug-session",
                  "runId": "ci-pre",
                  "hypothesisId": hypothesis_id,
                  "location": "ci.yml:debug-micromamba-cache-state",
                  "message": message,
                  "data": data,
                  "timestamp": int(time.time() * 1000),
              }
              with log_path.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(payload) + "\n")

          cache_hit = os.environ.get("CACHE_HIT", "")
          binary_path = Path.home() / "micromamba-bin" / "micromamba"
          root_path = Path.home() / "micromamba"
          binary_exists = binary_path.exists()
          root_exists = root_path.exists()
          binary_stat = None
          if binary_exists:
              st = binary_path.stat()
              binary_stat = {
                  "mode": stat.filemode(st.st_mode),
                  "size": st.st_size,
                  "is_exec": os.access(binary_path, os.X_OK),
              }
          write_log(
              "cache-restore output and paths",
              {
                  "cache_hit": cache_hit,
                  "binary_path": str(binary_path),
                  "root_path": str(root_path),
                  "binary_exists": binary_exists,
                  "root_exists": root_exists,
              },
              "H1",
          )
          write_log(
              "binary metadata and shell resolution",
              {
                  "binary_stat": binary_stat,
                  "which_micromamba": shutil.which("micromamba"),
              },
              "H2",
          )
          PY
          # #endregion

      - name: Setup micromamba (cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: toolbox_env_conda.yml
          environment-name: tbe
          cache-environment: false
          cache-downloads: false
          micromamba-binary-path: ~/micromamba-bin/micromamba
          micromamba-root-path: ~/micromamba
          init-shell: bash

      - name: Initialize micromamba from cache (cache hit)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          # Make micromamba available to subsequent steps without shell hooks
          echo "$HOME/micromamba-bin" >> "$GITHUB_PATH"
          echo "MAMBA_ROOT_PREFIX=$HOME/micromamba" >> "$GITHUB_ENV"
          # Verify setup using full path
          ~/micromamba-bin/micromamba --version
          ~/micromamba-bin/micromamba env list

      - name: Install CPU-only PyTorch and dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          ~/micromamba-bin/micromamba install -n tbe -y pytorch cpuonly -c pytorch -c conda-forge
          pip install esm

      - name: Save micromamba environment cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/micromamba/envs
            ~/micromamba-bin
          key: ${{ steps.cache-key.outputs.key }}

      - name: Run tests
        run: |
          ~/micromamba-bin/micromamba run -n tbe pytest ./tests

      - name: Debug micromamba runtime state
        if: always()
        run: |
          # #region agent log
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          log_path = Path(workspace) / ".cursor" / "debug.log"
          log_path.parent.mkdir(parents=True, exist_ok=True)

          def write_log(message, data, hypothesis_id):
              payload = {
                  "sessionId": "debug-session",
                  "runId": "ci-post",
                  "hypothesisId": hypothesis_id,
                  "location": "ci.yml:debug-micromamba-runtime-state",
                  "message": message,
                  "data": data,
                  "timestamp": int(time.time() * 1000),
              }
              with log_path.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(payload) + "\n")

          def run_cmd(cmd):
              try:
                  result = subprocess.run(cmd, check=False, capture_output=True, text=True)
                  return result.returncode, result.stdout.strip(), result.stderr.strip()
              except Exception as exc:
                  return 1, "", str(exc)

          which_code, which_out, which_err = run_cmd(["/usr/bin/which", "micromamba"])
          version_code, version_out, version_err = run_cmd(["/home/runner/micromamba-bin/micromamba", "--version"])
          write_log(
              "runtime micromamba availability",
              {
                  "path_env": os.environ.get("PATH"),
                  "which_code": which_code,
                  "which_out": which_out,
                  "which_err": which_err,
                  "version_code": version_code,
                  "version_out": version_out,
                  "version_err": version_err,
              },
              "H3",
          )
          PY
          # #endregion

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micromamba-debug-log
          path: .cursor/debug.log
