name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: |
          # Create a hash from the environment file and PyTorch CPU install string
          ENV_HASH=$(sha256sum toolbox_env_conda.yml | cut -d' ' -f1)
          PYTORCH_SPEC="pytorch-cpuonly"
          CACHE_KEY="micromamba-${{ runner.os }}-${ENV_HASH}-${PYTORCH_SPEC}"
          echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

      - name: Restore micromamba environment cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/micromamba/envs
            ~/micromamba-bin
          key: ${{ steps.cache-key.outputs.key }}

      - name: Setup micromamba (cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: toolbox_env_conda.yml
          environment-name: tbe
          cache-environment: false
          cache-downloads: false
          micromamba-binary-path: ~/micromamba-bin/micromamba
          micromamba-root-path: ~/micromamba
          init-shell: bash

      - name: Initialize micromamba from cache (cache hit)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          # Set up micromamba shell hooks in bash profile so they persist across steps
          # This mimics what setup-micromamba does with init-shell: bash
          MICROMAMBA_ROOT=~/micromamba
          export MAMBA_ROOT_PREFIX=$MICROMAMBA_ROOT
          # Add initialization to .bashrc so it's available in subsequent steps
          echo 'export MAMBA_ROOT_PREFIX=~/micromamba' >> ~/.bashrc
          echo 'export PATH="$HOME/micromamba-bin:$MAMBA_ROOT_PREFIX/bin:$PATH"' >> ~/.bashrc
          echo 'eval "$(~/micromamba-bin/micromamba shell hook --shell bash)"' >> ~/.bashrc
          # Also initialize for current step
          eval "$(~/micromamba-bin/micromamba shell hook --shell bash)"
          # Verify setup
          micromamba --version
          micromamba env list

      - name: Install CPU-only PyTorch and dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          micromamba install -y pytorch cpuonly -c pytorch -c conda-forge
          pip install esm

      - name: Save micromamba environment cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/micromamba/envs
            ~/micromamba-bin
          key: ${{ steps.cache-key.outputs.key }}

      - name: Run tests
        run: |
          # Activate environment (needed for cache hit case)
          micromamba activate tbe
          pytest ./tests
